plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation group: 'io.netty', name: 'netty-all', version: '4.1.139.Final'
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.mnemosynehermesteam.App'
    applicationName = "mnemosyneDB"
}

tasks.named('test') {
    useJUnitPlatform()
}