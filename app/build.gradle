plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation group: 'io.netty', name: 'netty-all', version: '4.1.139.Final'
}

application {
    // Define the main class for the application.
    mainClass = 'org.mnemosynehermesteam.App'
}
