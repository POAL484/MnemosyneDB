name: Tests and build

on:
  pull_request:
    branches: [ "main", "dev/**" ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew clean test

  build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      
      - name: Build
        run: ./gradlew installDist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MnemosyneDB
          path: app/build/install/
  
  integrety-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
      
      - name: Checkout integrety tests code
        run: |-
          git init
          git remote add origin https://github.com/POAL484/MHDbPy
          git fetch origin integrety-test
          git switch --detach origin/integrety-test
        
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Setup Python Env
        run: pip install -r requirements.txt
      
      - name: Download MnemosyneDB
        uses: actions/download-artifact@v4
        with:
          name: MnemosyneDB
          path: dist

      - name: Run integrety tests
        run: |-
          chmod +x dist/MnemosyneDB/bin/MnemosyneDB
          ./dist/MnemosyneDB/bin/MnemosyneDB &> /dev/null &
          sleep 10
          python integrety-test.py
          kill `jobs -l | grep -Eo '[[:digit:]]{2,}'`




